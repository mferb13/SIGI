services:
  db:
    image: postgres:16
    container_name: sigi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sigi_db
      POSTGRES_USER: sigi_user
      POSTGRES_PASSWORD: sigi_local_2026
    ports:
      - "5432:5432"
    volumes:
      - sigi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sigi_user -d sigi_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sigi_postgres_data:
